<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Up ML - by ECHO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background-color: #0f172a; color: #e2e8f0; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px; background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
        }
        .container {
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            width: 100%; max-width: 450px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden;
        }
        .container::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 24px; font-weight: 700; color: #ffffff; margin-bottom: 5px; }
        .header h1 span { color: #3b82f6; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .header p { font-size: 13px; color: #94a3b8; letter-spacing: 1px; font-weight: 600; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: 400; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 15px; background: #0f172a; border: 1px solid #334155;
            border-radius: 10px; color: #ffffff; font-size: 14px; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        
        .dana-info {
            background: rgba(59, 130, 246, 0.1); border: 1px dashed #3b82f6;
            border-radius: 10px; padding: 15px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 15px;
        }
        .dana-info i { color: #3b82f6; font-size: 24px; }
        .dana-info div p { font-size: 12px; color: #94a3b8; margin-bottom: 2px; }
        .dana-info div strong { font-size: 16px; color: #ffffff; letter-spacing: 1px; }

        .btn-buy {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #ffffff;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-buy:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4); }

        #receiptArea {
            display: none; background: rgba(15, 23, 42, 0.9); border: 1px solid #10b981;
            border-radius: 10px; padding: 20px; margin-top: 20px; animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .receipt-header { text-align: center; color: #10b981; margin-bottom: 15px; font-weight: 700; font-size: 16px; border-bottom: 1px dashed #334155; padding-bottom: 10px; }
        .receipt-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: #cbd5e1; }
        .receipt-row span:last-child { font-weight: 600; color: #ffffff; }
        .receipt-total { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; color: #f59e0b; margin-top: 15px; border-top: 1px dashed #334155; padding-top: 15px; }

        .btn-wa {
            display: flex; justify-content: center; align-items: center; width: 100%;
            padding: 12px; margin-top: 20px; background: #25D366; color: white; text-decoration: none;
            border-radius: 10px; font-weight: 600; gap: 10px; transition: 0.3s;
        }
        .btn-wa:hover { background: #128C7E; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4); }
        
        .footer { text-align: center; margin-top: 25px; font-size: 11px; color: #64748b; border-top: 1px solid #334155; padding-top: 15px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Top Up <span>Mobile Legends</span></h1>
            <p>by ECHO</p>
        </div>

        <form id="topupForm" onsubmit="prosesPesanan(event)">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> User ID MLBB</label>
                <input type="number" id="userId" placeholder="Masukkan User ID (Contoh: 12345678)" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-globe"></i> Zone ID</label>
                <input type="number" id="zoneId" placeholder="Masukkan Zone ID (Contoh: 1234)" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-gem"></i> Pilih Diamond</label>
                <select id="nominal" required>
                    <option value="" disabled selected>-- Pilih Nominal --</option>
                    <option value="1500" data-diamond="5">5 Diamonds - Rp 1.500</option>
                    <option value="3500" data-diamond="12">12 Diamonds - Rp 3.500</option>
                    <option value="5000" data-diamond="19">19 Diamonds - Rp 5.000</option>
                    <option value="10000" data-diamond="36">36 Diamonds - Rp 10.000</option>
                    <option value="20000" data-diamond="74">74 Diamonds - Rp 20.000</option>
                    <option value="50000" data-diamond="172">172 Diamonds - Rp 50.000</option>
                </select>
            </div>

            <div class="dana-info">
                <i class="fa-solid fa-wallet"></i>
                <div>
                    <p>Transfer Pembayaran ke DANA:</p>
                    <strong>0819-2796-8238</strong>
                    <p style="font-size: 10px; margin-top: 4px;">a.n ECHO Store</p>
                </div>
            </div>

            <button type="submit" class="btn-buy" id="btnBeli">
                <i class="fa-solid fa-cart-shopping"></i> Beli & Konfirmasi
            </button>
        </form>

        <div id="receiptArea">
            <div class="receipt-header">
                <i class="fa-solid fa-check-circle"></i> Pesanan Dibuat!
            </div>
            <div class="receipt-row">
                <span>User ID:</span>
                <span id="resId">-</span>
            </div>
            <div class="receipt-row">
                <span>Zone ID:</span>
                <span id="resZone">-</span>
            </div>
            <div class="receipt-row">
                <span>Item:</span>
                <span id="resItem">-</span>
            </div>
            <div class="receipt-row">
                <span>Kode Invoice:</span>
                <span id="resInvoice" style="color:#3b82f6;">-</span>
            </div>
            <div class="receipt-total">
                <span>Total Transfer:</span>
                <span id="resTotal">Rp 0</span>
            </div>

            <a href="#" id="btnWa" target="_blank" class="btn-wa">
                <i class="fa-brands fa-whatsapp"></i> Konfirmasi via WhatsApp
            </a>
        </div>

        <div class="footer">
            &copy; 2026 ECHO Store. All rights reserved.<br>
            Powered by Danzz
        </div>
    </div>

    <script>
        const NOMOR_WA_ADMIN = "6281927968238"; 

        function prosesPesanan(event) {
            event.preventDefault();
            const userId = document.getElementById('userId').value;
            const zoneId = document.getElementById('zoneId').value;
            const select = document.getElementById('nominal');
            const harga = parseInt(select.value);
            const diamond = select.options[select.selectedIndex].getAttribute('data-diamond');
            const invoice = "ECHO-" + Math.floor(1000 + Math.random() * 9000);

            document.getElementById('resId').innerText = userId;
            document.getElementById('resZone').innerText = zoneId;
            document.getElementById('resItem').innerText = diamond + " Diamonds";
            document.getElementById('resInvoice').innerText = invoice;
            document.getElementById('resTotal').innerText = "Rp " + harga.toLocaleString('id-ID');

            document.getElementById('topupForm').style.display = 'none';
            document.getElementById('receiptArea').style.display = 'block';

            const pesanWa = `Halo Admin ECHO, saya mau konfirmasi Top Up ML.%0A%0A` +
                            `*Kode Invoice:* ${invoice}%0A` +
                            `*User ID:* ${userId} (${zoneId})%0A` +
                            `*Item:* ${diamond} Diamonds%0A` +
                            `*Total Transfer:* Rp ${harga.toLocaleString('id-ID')}%0A%0A` +
                            `Saya sudah transfer ke DANA *081927968238*. Berikut saya lampirkan bukti transfernya:`;
            
            document.getElementById('btnWa').href = `https://wa.me/${NOMOR_WA_ADMIN}?text=${pesanWa}`;
        }
    </script>
</body>
</html>
